apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-green
  namespace: cuny-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
      version: green
  template:
    metadata:
      labels:
        app: web
        version: green
    spec:
      containers:
        - name: web-container
          image: nginx:1.25
