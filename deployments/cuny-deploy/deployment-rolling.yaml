apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deploy-rolling
  namespace: cuny-deploy
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: web-rolling
  template:
    metadata:
      labels:
        app: web-rolling
    spec:
      containers:
        - name: web-container
          image: nginx:1.25
