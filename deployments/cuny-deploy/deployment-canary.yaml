apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
  namespace: cuny-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
      version: canary
  template:
    metadata:
      labels:
        app: web
        version: canary
    spec:
      containers:
        - name: web-container
          image: nginx:1.25
