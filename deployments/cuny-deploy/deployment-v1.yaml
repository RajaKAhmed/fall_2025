apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deploy
  namespace: cuny-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web-container
          image: nginx:1.19
          ports:
            - containerPort: 80
