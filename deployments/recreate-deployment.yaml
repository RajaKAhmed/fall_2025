apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cuny-deployments
  name: dep-recreate
  labels:
    app: nginx

spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx-container
          image: nginx:1.28.0
          ports:
            - containerPort: 80