apiVersion: v1
kind: Pod
metadata:
  namespace: udemy
  name: ude-sidecar-pod
spec:
  volumes: 
  - name: logs
    emptyDir: {}

  containers:
  - name: app-container
    image: alpine
    command: ["/bin/sh"]
    args: ["-c", "while true; do date >> /var/log/app.log; sleep 20; done"]
    volumeMounts: 
    - name: logs
      mountPath: /var/log

  - name: log-exporter-sidecar
    image: nginx
    ports:
      - containerPort: 80
    volumeMounts:
    - name: logs
      mountPath: /usr/share/nginx/html

